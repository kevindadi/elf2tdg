[package]
name = "elf2tdg"
description = "Static Task Dependency Graph extraction from embedded ELF images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "elf2tdg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_arm", "arch_arm64", "arch_riscv", "arch_x86"] }
clap = { version = "4", features = ["derive"] }
elf2tdg-schema = { path = "../elf2tdg-schema" }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
object = { version = "0.39", default-features = false, features = ["read", "std"] }
petgraph = { version = "0.8.3", default-features = false, features = ["std", "stable_graph"] }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
